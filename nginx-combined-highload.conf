# Nginx Configuration for High Load (100K+ Users)
# This configuration includes load balancing and optimizations for high traffic
# Place this file in /etc/nginx/sites-available/
# Then create symlink: ln -s /etc/nginx/sites-available/wedding-venue /etc/nginx/sites-enabled/
# Test config: sudo nginx -t
# Reload nginx: sudo nginx -s reload

# Upstream backend pool for load balancing
upstream backend_pool {
    least_conn;  # Use least connections load balancing strategy
    # With PM2 cluster mode, all instances use same port (8030)
    # PM2 handles internal load balancing, but nginx upstream is useful for multiple servers
    server localhost:8030 max_fails=3 fail_timeout=30s weight=1;
    # If running multiple servers, add more:
    # server server2.example.com:8030 max_fails=3 fail_timeout=30s weight=1;
    # server server3.example.com:8030 max_fails=3 fail_timeout=30s weight=1;
    keepalive 32;  # Keep connections alive for better performance
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;  # Per IP: 100 requests per minute
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=1000r/m;  # General limit

server {
    listen 80;
    server_name syniwedding.synilogictech.in;  # Update with your domain
    
    # Increase buffer sizes for high load
    client_max_body_size 100M;
    client_body_buffer_size 1M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    
    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65;
    
    # Admin Panel
    location /admin {
        alias /var/www/admin/dist;  # Update with your actual admin build path
        index index.html;
        
        # SPA routing - serve index.html for all routes
        try_files $uri $uri/ /admin/index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;  # Don't log static assets to reduce I/O
        }
    }
    
    # Vendor Web
    location /vendor {
        alias /var/www/vendor/dist;  # Update with your actual vendor build path
        index index.html;
        
        # SPA routing - serve index.html for all routes
        try_files $uri $uri/ /vendor/index.html;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;  # Don't log static assets to reduce I/O
        }
    }
    
    # API proxy to backend with load balancing
    location /api {
        # Apply rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://backend_pool;  # Use upstream pool instead of direct localhost
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-device-id $http_x_device_id;
        proxy_cache_bypass $http_upgrade;
        
        # Connection pooling
        proxy_set_header Connection "";
        
        # Timeouts for high load
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering optimizations
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # CORS headers for preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-device-id' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }
        
        # Increase timeouts for file uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Serve uploads directory with caching
    location /uploads {
        alias /var/www/backend/uploads;  # Update with your actual uploads path
        expires 30d;  # Cache uploads for 30 days
        add_header Cache-Control "public";
        
        # CORS headers for images
        add_header Access-Control-Allow-Origin *;
        
        # Enable gzip for images if possible
        gzip_static on;
    }
    
    # Root location (optional - for main website)
    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Health check endpoint (not rate limited)
    location /health {
        access_log off;
        proxy_pass http://backend_pool/api/health;
        proxy_set_header Host $host;
    }
}

# Enable gzip compression globally
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
gzip_disable "msie6";

# Cache configuration for static content
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

